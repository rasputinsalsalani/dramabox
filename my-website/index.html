
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MovieFlixHD | Premium Movie Experience</title>

  <meta name="description" content="Explore movies, TV shows and anime with MovieFlixHD. Discover trending entertainment in a premium cinematic experience.">

  <meta name="theme-color" content="#090a0d">

  <link rel="stylesheet" href="css/home.css">

  <script defer src="js/home.js"></script>
</head>

<body>

  <!-- NAVIGATION -->

  <header class="navbar">
    <div class="nav-inner">

      <img
        class="logo"
        src="https://i.ibb.co/W4TZSVj4/logo.png"
        alt="MovieFlixHD Logo"
      >

      <div class="search-wrapper">
        <input
          id="search-input"
          type="search"
          placeholder="Search movies, shows..."
          autocomplete="off"
          aria-label="Search movies and TV shows"
          oninput="searchTMDB(this.value)"
        >
      </div>

    </div>
  </header>


  <!-- HERO BANNER -->

  <section class="banner" id="banner">

    <div
      class="banner-content"
      onclick="openFromBanner()"
      role="button"
      tabindex="0"
      aria-label="Open featured movie"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFromBanner()}"
    >

      <span class="banner-label">FEATURED CONTENT</span>

      <h1 id="banner-title"></h1>

      <p id="banner-desc"></p>

      <button
        type="button"
        class="banner-play"
        onclick="event.stopPropagation();openFromBanner()"
      >
        ▶ Watch Now
      </button>

    </div>

  </section>


  <!-- MAIN CONTENT -->

  <main>

    <!-- SEARCH RESULTS -->

    <section
      class="row box red-glow"
      id="search-section"
      hidden
    >

      <h2>Search Results</h2>

      <div class="grid" id="search-results"></div>

    </section>


    <!-- TRENDING MOVIES -->

    <section class="row box red-glow">

      <h2>Trending Movies</h2>

      <div class="grid-2" id="movies-list"></div>

    </section>


    <!-- TV SHOWS -->

    <section class="row box red-glow">

      <h2>Popular TV Shows</h2>

      <div class="grid-2" id="tvshows-list"></div>

    </section>


    <!-- ANIME -->

    <section class="row box red-glow">

      <h2>Trending Anime</h2>

      <div class="grid-2" id="anime-list"></div>

    </section>

  </main>


  <!-- MOVIE PLAYER MODAL -->

  <div
    class="modal"
    id="modal"
    aria-label="Movie player"
    aria-modal="true"
    role="dialog"
  >

    <div class="modal-content">

      <!-- CLOSE BUTTON -->

      <button
        type="button"
        class="close"
        onclick="closeModal()"
        aria-label="Close player"
      >
        ✕
      </button>


      <!-- PLAYER HEADER -->

      <div class="player-header">

        <div class="player-heading">

          <span class="player-tag">NOW PLAYING</span>

          <h2 id="player-heading-title">MovieFlixHD Player</h2>

        </div>

      </div>


      <!-- VIDEO PLAYER -->

      <div class="video-container">

        <div class="player-message">
          Select a movie to start watching.
        </div>

      </div>


      <!-- SERVER CONTROLS -->

      <div class="player-controls">

        <div class="server-info">

          <span class="server-indicator"></span>

          <span>
            Active:
            <strong id="server-name">VidSrc</strong>
          </span>

        </div>


        <!-- SERVER SELECTOR -->

        <div
          class="server-selector"
          role="group"
          aria-label="Choose video server"
        >

          <button
            type="button"
            class="server-btn active"
            data-server="0"
            aria-pressed="true"
            onclick="selectServer(0)"
          >
            VidSrc
          </button>

          <button
            type="button"
            class="server-btn"
            data-server="1"
            aria-pressed="false"
            onclick="selectServer(1)"
          >
            VidRift
          </button>

          <button
            type="button"
            class="server-btn"
            data-server="2"
            aria-pressed="false"
            onclick="selectServer(2)"
          >
            EmbedWave
          </button>

        </div>


        <!-- NEXT SERVER -->

        <button
          type="button"
          class="next-server-btn"
          onclick="nextServer()"
        >
          Next Server ↗
        </button>

      </div>


      <!-- MOVIE INFORMATION -->

      <div class="info-wrapper">

        <div class="info-text">

          <h2 id="modal-title"></h2>

          <p id="modal-description"></p>

        </div>

      </div>

    </div>

  </div>


  <!-- FOOTER -->

  <footer class="footer">

    <p>
      © <span id="current-year"></span> MovieFlixHD.
      All rights reserved.
    </p>

    <p class="footer-note">
      Movie information and posters powered by TMDB.
    </p>

  </footer>


  <!-- CURRENT YEAR -->

  <script>
    document.getElementById("current-year").textContent =
      new Date().getFullYear();
  </script>

</body>

</html>
