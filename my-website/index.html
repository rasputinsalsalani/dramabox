<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drama Box</title>

<link rel="stylesheet" href="css/home.css">
<script defer src="js/home.js"></script>
</head>

<body>

<header class="navbar">
  <div class="nav-inner">
    <img class="logo" src="https://i.ibb.co/W4TZSVj4/logo.png">

    <div class="search-wrapper">
      <input id="search-input" placeholder="Search..." oninput="searchTMDB(this.value)">
    </div>
  </div>
</header>

<section class="banner" id="banner">
  <div class="banner-content" onclick="openFromBanner()">
    <h1 id="banner-title"></h1>
    <p id="banner-desc"></p>
  </div>
</section>

<main>

<section class="row box red-glow" id="search-section" hidden>
  <h2>🔍 Search Results</h2>
  <div class="grid" id="search-results"></div>
</section>

<section class="row box red-glow">
  <h2>🎬 Movies</h2>
  <div class="grid-2" id="movies-list"></div>
</section>

<section class="row box red-glow">
  <h2>📺 TV Shows</h2>
  <div class="grid-2" id="tvshows-list"></div>
</section>

<section class="row box red-glow">
  <h2>🎌 Anime</h2>
  <div class="grid-2" id="anime-list"></div>
</section>

</main>

<div class="modal" id="modal">
  <div class="modal-content">

    <span class="close" onclick="closeModal()">✖</span>

    <div class="video-container"></div>

    <div class="info-wrapper">
      <div class="info-text">
        <h2 id="modal-title"></h2>
        <p id="modal-description"></p>
      </div>
    </div>

  </div>
</div>

</body>
</html>
